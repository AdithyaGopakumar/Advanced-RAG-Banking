# Local Elasticsearch deployment.
# Use with the local profile so the API container talks to the Compose cluster
# instead of the cloud credentials in .env:
#
#   docker compose --profile local -f docker-compose.yml -f docker-compose.local.yml up --build
services:
  api:
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ELASTICSEARCH_API_KEY=
      - ELASTICSEARCH_USERNAME=
      - ELASTICSEARCH_PASSWORD=
    depends_on:
      - elasticsearch
